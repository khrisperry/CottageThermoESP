name: Controller mDNS and room-panel discovery bench builds

on:
  push:
    branches:
      - feature/controller-mdns-discovery-web
  pull_request:
    branches:
      - feature/connectivity-climate-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check embedded web-page JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          for(const path of ['controller/main/ui.html','touchscreen/main/settings.html']){
            const html=fs.readFileSync(path,'utf8');
            const matches=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
            if(!matches.length)throw Error('Missing script: '+path);
            for(const m of matches)new Function(m[1]);
            console.log('PASS:',path,'scripts:',matches.length);
          }
          NODE

  controller-workflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DaveGamble/cJSON
          ref: v1.7.19
          path: .test-deps/cjson
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test travel calibration and actual HTTP handler
        run: |
          cmake -S tests -B build-host -DCJSON_SOURCE_DIR="$PWD/.test-deps/cjson"
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure
      - name: Test embedded controller workflow
        working-directory: tests
        run: |
          npm ci --ignore-scripts
          npm run test:controller

  build-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build ESP32-S3 Super Mini (4 MB)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          path: controller
          command: idf.py -B build-supermini -D SDKCONFIG=sdkconfig.supermini -D SDKCONFIG_DEFAULTS=sdkconfig.supermini.defaults build
      - name: Upload Super Mini flash files
        uses: actions/upload-artifact@v4
        with:
          name: CottageController-v0.6.4-SuperMini
          retention-days: 14
          if-no-files-found: error
          path: |
            controller/build-supermini/bootloader/bootloader.bin
            controller/build-supermini/partition_table/partition-table.bin
            controller/build-supermini/*.bin
            controller/build-supermini/flasher_args.json
            controller/build-supermini/flash_args

  build-room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare nonsecret display build
        run: cp touchscreen/secrets.h.example touchscreen/secrets.h
      - name: Build Waveshare 4B (16 MB)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          path: touchscreen
          command: idf.py -B build-4b -D SDKCONFIG=sdkconfig.4b -D SDKCONFIG_DEFAULTS=sdkconfig.defaults build
      - name: Upload 4B app image for OTA
        uses: actions/upload-artifact@v4
        with:
          name: CottageRoomPanel-v0.13.8-4B-application
          retention-days: 14
          if-no-files-found: error
          path: |
            touchscreen/build-4b/*.bin
            touchscreen/build-4b/flasher_args.json
