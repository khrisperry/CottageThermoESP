<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cottage room thermostat</title><style>body{font:18px system-ui;background:#102832;color:#e6f3ee;max-width:560px;margin:40px auto;padding:24px}main{padding:24px;border:1px solid #54717b;border-radius:20px}.temp{font-size:60px}input,button{font:inherit;padding:12px;border-radius:8px;max-width:100%;box-sizing:border-box}button{background:#b0e3c9;cursor:pointer}p{line-height:1.5}#error{color:#ffbd9c}</style><main><h1>Cottage</h1><p><a href="/home" style="color:#b0e3c9">Home · Laundry · Camera</a></p><label>Pairing token <input id="token" type="password" autocomplete="off"></label><button onclick="connect()">Connect</button><p>Room temperature</p><div id="temp" class="temp">—</div><p id="health">Waiting for controller</p><label>Target °F <input id="target" type="number" min="45" max="80" step="0.5" value="65"></label><button onclick="save()">Set target</button><p id="mode"></p><p id="error" role="status"></p><p><small>The controller keeps your settings when this room client restarts. Calibration, operating mode and bench controls are on the controller.</small></p></main><script>
const el=id=>document.getElementById(id);let loaded=false;el('token').value=sessionStorage.getItem('roomToken')||'';
async function req(path,data){let o={cache:'no-store',headers:{'X-Thermo-Token':el('token').value}};if(data){o.method='POST';o.headers['Content-Type']='application/json';o.body=JSON.stringify(data)}let r=await fetch(path,o);if(!r.ok)throw Error(await r.text());return r.json()}
async function refresh(){if(!el('token').value)return;try{let s=await req('/api/status');el('temp').textContent=s.temperature_f===undefined?'—':s.temperature_f.toFixed(1)+'°F';el('health').textContent=s.reason.replaceAll('_',' ')+' · '+s.source;el('mode').textContent=s.mode+(s.simulation?' · simulation':' · live bench');if(!loaded||document.activeElement!==el('target')){el('target').value=s.target_f;loaded=true}el('error').textContent=''}catch(e){el('error').textContent=e.message;el('temp').textContent='—';el('health').textContent='Controller unavailable'}}
function connect(){sessionStorage.setItem('roomToken',el('token').value);loaded=false;refresh()}
async function save(){try{await req('/api/target',{target_f:+el('target').value});await refresh()}catch(e){el('error').textContent=e.message}}setInterval(refresh,5000);refresh();
</script></html>
